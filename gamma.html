<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gamma draconis candle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cinzel:wght@500;600;700&display=swap">
<style>
/* Same frame as the pink reading candle, re-dressed for the gamma draconis hub: a candlelit Slytherin library after dark. Single dark look on purpose. */
:root{--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--serif:"Cormorant Garamond","EB Garamond",Georgia,"Times New Roman",serif;
--cinzel:"Cinzel","Trajan Pro",Georgia,serif;
--ink:#e3ebe6;--muted:#8fa79b;--pink:#4fbf8a;--pink-mid:#2f5d48;--pink-lt:#1d3329;--green:#c3cdc8;--green-soft:#1a2a23;--paper:#0f1915;--page:#0a110e;--silver:#c3cdc8;--emerald:#1f7a52;--deep:#132019;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font:400 14px/1.5 var(--font)}
main{max-width:1020px;margin:0 auto;padding:30px 14px 36px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:30px 16px;align-items:start}
@media(min-width:780px){.layout{grid-template-columns:minmax(0,1fr) 270px}}
.stack{display:grid;gap:30px;min-width:0}
.card{position:relative;background:var(--paper);border:2px solid #3b7f60;box-shadow:0 10px 40px rgba(0,0,0,.45);border-radius:22px;padding:26px 22px 22px}
.card::before{content:"";position:absolute;inset:4px;border:1px solid rgba(195,205,200,.45);border-radius:18px;pointer-events:none}
.card::after{content:"";position:absolute;inset:9px;border:1px solid rgba(79,191,138,.18);border-radius:13px;pointer-events:none}
.card>*{position:relative;z-index:1}
.card.side{display:flex;flex-direction:column}
.lbl{z-index:2;position:absolute;top:-10px;left:26px;background:var(--paper);padding:0 10px;font:600 11px/20px var(--cinzel);letter-spacing:.2em;text-transform:uppercase;color:var(--silver)}
h1{font:700 38px/1.05 var(--serif);margin:2px 0 4px;text-wrap:balance}
h1 em{font-style:italic;color:var(--pink);font-weight:600}
h1,.shead h2{color:#eef3f0;letter-spacing:.01em}
.meta{color:var(--muted);font-size:13px}.meta b{color:var(--green)}

.nook{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:16px}
@media(min-width:640px){.nook{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center}}

/* the library nook: daylight when unlit, candlelit dusk when lit */
.stage{position:relative;height:470px;border-radius:14px;overflow:hidden;background:#0c1512;box-shadow:inset 0 0 0 1px #2a4438}
.stage #bg{position:absolute;inset:0;width:100%;height:100%}
.dim{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease;
background:radial-gradient(ellipse 70% 60% at 50% 38%,rgba(20,30,24,.25),rgba(4,8,6,.82) 75%)}
.warm{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease;
background:radial-gradient(circle at 50% var(--fy,30%),rgba(255,196,120,.36),rgba(255,170,90,.1) 28%,transparent 52%)}
.stage.lit .dim,.stage.lit .warm{opacity:1}
.stage #cv{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:min(96%,400px);height:auto;overflow:visible}
.swatches{position:absolute;top:12px;right:12px;z-index:2;display:flex;gap:6px;padding:5px 7px;border-radius:999px;background:rgba(255,255,255,.78)}
.sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--pink);outline-offset:2px}

.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.state{font:600 11px/1 var(--cinzel);letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
.state b{color:var(--pink)}
.clock{font:600 72px/0.95 var(--serif);font-variant-numeric:tabular-nums;color:#f1f5f2;text-shadow:0 0 24px rgba(79,191,138,.18)}
.with{font:500 20px/1.2 var(--serif);color:var(--muted);margin-top:-4px}
.with em{color:var(--pink);font-weight:600}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:400 13px var(--font);border:1px solid var(--pink-mid);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--emerald);border-color:#4fbf8a;color:#f1f5f2}
.chip:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input:not([type]){font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--pink-mid);background:var(--paper);border-radius:12px;padding:8px 10px;min-width:0;width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 13px var(--cinzel);letter-spacing:.08em;border:1px solid #4fbf8a;border-radius:999px;padding:11px 24px;cursor:pointer;background:linear-gradient(#22875b,#175e40);color:#f1f5f2;box-shadow:0 0 18px rgba(79,191,138,.18)}
.btn.alt{background:transparent;border-color:rgba(195,205,200,.5);color:var(--silver);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.link{font:600 13px var(--font);background:none;border:0;color:var(--green);cursor:pointer;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.link:disabled{opacity:.35;cursor:default;text-decoration:none}
.logrow{border:1px solid var(--pink-mid);background:#14231c;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.logrow p{margin:0;font:500 17px/1.3 var(--serif)}
.logrow .acts input{width:110px;flex:none}
.chip:focus-visible,.sw:focus-visible,.btn:focus-visible,.link:focus-visible,.tile:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}

/* soundscape */
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.shead h2{font:700 28px/1.1 var(--serif);margin:0}
.shead h2 em{font-style:italic;color:var(--pink);font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:14px 0}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px 12px;border:1px solid var(--pink-mid);border-radius:16px;background:var(--paper);color:var(--ink);font:500 13px var(--font);cursor:pointer}
.tile svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile[aria-pressed="true"]{background:#163327;border-color:#4fbf8a;color:#7fdcae}
.tile[aria-pressed="true"]::after{content:"";position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--pink);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.vol{display:grid;grid-template-columns:auto minmax(0,1fr) 3.2em;gap:12px;align-items:center;font-size:13px;margin-bottom:12px}
.vol output{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--pink)}

/* side card */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#14231c;border:1px solid var(--pink-mid);border-radius:12px;padding:9px 11px}
.stat b{display:block;font:700 22px/1.15 var(--font);color:#f1f5f2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sub{font:600 11px/1 var(--cinzel);letter-spacing:.16em;text-transform:uppercase;color:var(--green);margin:18px 0 8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:92px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.bar i{display:block;width:100%;max-width:22px;border-radius:6px 6px 2px 2px;background:var(--pink-mid);min-height:3px}
.bar.today i{background:var(--pink)}
.bar.today{color:var(--pink);font-weight:700}
.bar small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;border-top:1px solid var(--pink-mid)}
.list div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--pink-lt);align-items:baseline}
.list em{font:600 16px/1.2 var(--serif);color:#eef3f0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list span{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font:italic 500 16px var(--serif);padding:8px 0}
.foot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tag{font:600 10px/1 var(--cinzel);letter-spacing:.12em;text-transform:uppercase;color:#7fdcae;background:#163327;border-radius:999px;padding:4px 8px}

/* flame */
.flame{transform-box:fill-box;transform-origin:50% 92%;animation:flick 1.7s ease-in-out infinite}
.glow{animation:glow 2.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}22%{transform:scale(.95,1.06) skewX(2.5deg)}48%{transform:scale(1.04,.96) skewX(-1.5deg)}71%{transform:scale(.97,1.04) skewX(1.2deg)}}
@keyframes glow{0%,100%{opacity:.9}40%{opacity:.72}70%{opacity:1}}
.smoke{opacity:0}
.smoke.go{animation:smoke 2.6s ease-out forwards}
@keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
@media (prefers-reduced-motion:reduce){.flame,.glow,.tile::after{animation:none}.smoke.go{animation:none}.dim,.warm{transition:none}}
</style>

<main>
<div class="layout">
<div class="stack">
<section class="card">
  <span class="lbl">The library after hours</span>
  <h1>read by <em>candlelight</em></h1>
  <div class="meta">The candle burns low while you read · <b id="metaDur">45 min</b> sitting</div>
  <div class="nook">

          <linearGradient id="goldH" x1="0" x2="1"><stop offset="0" stop-color="#2f3634"/><stop offset=".2" stop-color="#7f8a86"/><stop offset=".42" stop-color="#e9eeec"/><stop offset=".58" stop-color="#b3bdb9"/><stop offset=".82" stop-color="#5f6965"/><stop offset="1" stop-color="#262c2a"/></linearGradient>
          <linearGradient id="snakeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f1"/><stop offset=".45" stop-color="#9aa6a1"/><stop offset="1" stop-color="#4a5450"/></linearGradient>
          <linearGradient id="goldT" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="#6c7672"/><stop offset=".35" stop-color="#f4f8f6"/><stop offset=".6" stop-color="#b9c3bf"/><stop offset="1" stop-color="#4c5652"/></linearGradient>
          <radialGradient id="glowG"><stop offset="0" stop-color="#ffd38a" stop-opacity=".7"/><stop offset=".35" stop-color="#ffb35c" stop-opacity=".25"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
          <radialGradient id="flameG" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#fffef4"/><stop offset=".3" stop-color="#fff3bf"/><stop offset=".6" stop-color="#ffd166"/><stop offset=".86" stop-color="#ffa53a" stop-opacity=".85"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
          <radialGradient id="stamen" cx=".45" cy=".4"><stop offset="0" stop-color="#f7c46a"/><stop offset=".7" stop-color="#e79a3a"/><stop offset="1" stop-color="#c98a14"/></radialGradient>
          <linearGradient id="leafG" x1="0" x2="1"><stop offset="0" stop-color="#6aa84f"/><stop offset=".5" stop-color="#3f7d32"/><stop offset="1" stop-color="#285a20"/></linearGradient>
          <linearGradient id="budG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e98aa8"/><stop offset="1" stop-color="#fad3df"/></linearGradient>
          <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
        </defs>
        <circle class="glow" id="glow" cx="210" cy="40" r="200" fill="url(#glowG)" opacity="0"/>
        <ellipse cx="210" cy="434" rx="168" ry="13" fill="rgba(0,0,0,.55)" filter="url(#soft)"/>
        <!-- antique silver stand, a serpent wound round its neck -->
        <ellipse cx="210" cy="426" rx="142" ry="18" fill="#2b3230"/>
        <ellipse cx="210" cy="419" rx="142" ry="18" fill="url(#goldH)"/>
        <ellipse cx="210" cy="411" rx="136" ry="16" fill="url(#goldT)"/>
        <ellipse cx="210" cy="411" rx="136" ry="16" fill="none" stroke="#f2f6f4" stroke-opacity=".45" stroke-width="1.2"/>
        <ellipse cx="210" cy="411" rx="122" ry="13" fill="none" stroke="#2b3230" stroke-opacity=".35" stroke-width="1" stroke-dasharray="2 4"/>
        <ellipse cx="210" cy="404" rx="120" ry="13" fill="url(#goldH)"/>
        <ellipse cx="210" cy="398" rx="114" ry="12" fill="url(#goldT)"/>
        <path d="M100 360 V396 A110 12 0 0 0 320 396 V360Z" fill="url(#goldH)"/>

        <ellipse cx="210" cy="360" rx="110" ry="12" fill="url(#goldT)"/><ellipse cx="210" cy="360" rx="104" ry="10" fill="none" stroke="#f2f6f4" stroke-opacity=".5" stroke-width="1.2"/><ellipse cx="210" cy="361" rx="66" ry="8" fill="rgba(10,20,15,.3)"/>
        <g id="serpent">
          <path d="M102 374 C140 398 280 398 318 376" fill="none" stroke="#1e2422" stroke-width="13" stroke-linecap="round"/>
          <path d="M102 374 C140 398 280 398 318 376" fill="none" stroke="url(#snakeG)" stroke-width="10" stroke-linecap="round"/>
          <path d="M102 374 C140 398 280 398 318 376" fill="none" stroke="#2b3230" stroke-width="10" stroke-linecap="round" stroke-dasharray="1.2 4.2" opacity=".55"/>
          <path d="M106 371 C144 393 276 393 314 373" fill="none" stroke="#f4f8f6" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
          <path d="M318 376 C330 384 336 396 326 404 C318 410 300 410 286 407" fill="none" stroke="#1e2422" stroke-width="9" stroke-linecap="round"/>
          <path d="M318 376 C330 384 336 396 326 404 C318 410 300 410 286 407" fill="none" stroke="url(#snakeG)" stroke-width="6.5" stroke-linecap="round"/>
          <path d="M286 407 C276 406 270 405 262 406" fill="none" stroke="url(#snakeG)" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M102 374 C92 368 90 356 99 350" fill="none" stroke="#1e2422" stroke-width="11" stroke-linecap="round"/>
          <path d="M102 374 C92 368 90 356 99 350" fill="none" stroke="url(#snakeG)" stroke-width="8" stroke-linecap="round"/>
          <path d="M92 352 C94 342 108 338 116 344 C120 348 116 354 108 355 C102 356 96 356 92 352Z" fill="url(#goldT)" stroke="#1e2422" stroke-width="1.6"/>

          <path d="M116 349 l7 -1 m-7 1 l6 3" stroke="#7a1f2b" stroke-width="1" stroke-linecap="round"/>

        <g id="poolBack"></g>
        <g id="candle">
          <ellipse cx="210" cy="360" rx="60" ry="8" fill="url(#wax)"/><rect id="body" x="150" y="70" width="120" height="290" fill="url(#wax)"/>

              <ellipse cx="0" cy="1" rx="3.4" ry="4.2" fill="#ff9d4a" opacity=".45"/>

          </g>

        <g id="poolFront"></g>

    <div class="panel">
      <div class="state" id="state">ready</div>
      <div class="clock" id="clock">45:00</div>
      <div class="with">with <em id="withBook">This Bitter Earth</em></div>
      <label class="field" for="book">fic
        <input id="book" type="text" list="shelfBooks" placeholder="which fic are you reading?" autocomplete="off"></label>
      <datalist id="shelfBooks"><option value="This Bitter Earth"><option value="Aparecium"><option value="The Gloriana Set"><option value="A Darker Blue"><option value="What it Means to Love"></datalist>

<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dayKey(d)};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const f=n=>(+n).toFixed(1);

/* ================= library backdrop: a moonlit Slytherin reading room ================= */
(function library(){
  const r=rng(11),BOOK=['#123a2a','#0f2e22','#1d4a36','#2b1a14','#3a2016','#4a1c22','#1b1f1d','#2e3532','#0d2a1f','#35261b','#22332b','#5a1e26'];
  let s=`<defs>
  <pattern id="stone" width="60" height="30" patternUnits="userSpaceOnUse"><rect width="60" height="30" fill="#1a2420"/><path d="M0 .5H60M0 15.5H60M30 0V15M0 15V30M60 15V30" stroke="#0f1714" stroke-width="1.2"/><rect x="2" y="2" width="26" height="12" fill="#1e2a25" opacity=".6"/><rect x="33" y="17" width="25" height="11" fill="#16201c" opacity=".7"/></pattern>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b24"/><stop offset=".7" stop-color="#1b3340"/><stop offset="1" stop-color="#2a4650"/></linearGradient>
  <radialGradient id="moon"><stop offset="0" stop-color="#f3f7f2"/><stop offset=".6" stop-color="#cfdcd6"/><stop offset="1" stop-color="#cfdcd6" stop-opacity="0"/></radialGradient>

const KEY=new URLSearchParams(location.search).get('key')||'';

function log(){
  const list=all(),today=dayKey(),t=list.filter(s=>s.d===today);
  $('#sToday').textContent=t.reduce((a,s)=>a+s.m,0);
  $('#sPages').textContent=t.reduce((a,s)=>a+(s.p||0),0);
  const wk=new Set([...Array(7)].map((_,i)=>daysAgo(i)));
  $('#sWeek').textContent=list.filter(s=>wk.has(s.d)).length;
  const days=new Set(list.map(s=>s.d));let st=0,i=days.has(today)?0:1;while(days.has(daysAgo(i))){st++;i++}
  $('#sStreak').textContent=st;
  const per=[...Array(7)].map((_,i)=>{const k=daysAgo(6-i);return{k,m:list.filter(s=>s.d===k).reduce((a,s)=>a+s.m,0)}}),mx=Math.max(30,...per.map(x=>x.m));
  $('#week').innerHTML=per.map((x,i)=>'<div class="bar'+(i===6?' today':'')+'" title="'+x.m+' min"><small>'+(x.m||'')+'</small><i style="height:'+Math.round(x.m/mx*58)+'px"></i>'+new Date(x.k+'T00:00').toLocaleDateString(undefined,{weekday:'narrow'})+'</div>').join('');
  const recent=[...list].map((s,i)=>[s,i]).sort((a,b)=>b[0].d.localeCompare(a[0].d)||b[1]-a[1]).map(x=>x[0]).slice(0,5);
  $('#list').innerHTML=recent.length?recent.map(s=>{const when=s.d===today?'today':s.d===daysAgo(1)?'yesterday':new Date(s.d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
    return '<div><em>'+esc(s.b)+'</em><span>'+s.m+' min'+(s.p?' · '+s.p+' ch':'')+' · '+when+'</span></div>'}).join(''):'<div class="empty">Light the candle to log your first fic sitting.</div>';
  $('#foot').innerHTML=sessions===null?'<span class="tag">example sittings</span><button class="link" id="clr">clear examples</button>':(live?'<span>Synced with your Notion fic tracker.</span>':'<span>Small sittings count.</span>');
  const c=$('#clr');if(c)c.onclick=()=>{sessions=[];store.set('gd-sessions',sessions);log()};
}

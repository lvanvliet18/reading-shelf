<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gamma draconis fic jar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cinzel:wght@500;600;700&display=swap">
<style>
/* Gamma draconis companion: a glass jar of folded to-read slips. Same dark green card on a white page as the candle. */
:root{--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--serif:"Cormorant Garamond","EB Garamond",Georgia,serif;--cinzel:"Cinzel","Trajan Pro",Georgia,serif;
--ink:#e3ebe6;--muted:#8fa79b;--accent:#4fbf8a;--line:#2f5d48;--faint:rgba(79,191,138,.18);--paper:#0f1915;--page:#ffffff;
--silver:#c3cdc8;--emerald:#1f7a52;--parch:#efe6cf;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font:400 14px/1.5 var(--font)}
main{max-width:1020px;margin:0 auto;padding:30px 26px 48px}
.card{position:relative;background:var(--paper);border:2px solid #3b7f60;border-radius:22px;padding:26px 22px 22px;box-shadow:0 18px 44px rgba(6,14,10,.55),0 4px 14px rgba(6,14,10,.4)}
.card::before{content:"";position:absolute;inset:4px;border:1px solid rgba(195,205,200,.45);border-radius:18px;pointer-events:none}
.card::after{content:"";position:absolute;inset:9px;border:1px solid var(--faint);border-radius:13px;pointer-events:none}
.card>*{position:relative;z-index:1}
.lbl{z-index:2;position:absolute;top:-10px;left:26px;background:var(--paper);padding:0 10px;font:600 11px/20px var(--cinzel);letter-spacing:.2em;text-transform:uppercase;color:var(--silver)}
h1{font:700 36px/1.05 var(--serif);margin:2px 0 4px;color:#eef3f0;text-wrap:balance}
h1 em{font-style:italic;color:var(--accent);font-weight:600}
.meta{color:var(--muted);font-size:13px}.meta b{color:var(--silver)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:16px}
@media(min-width:640px){.grid{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:stretch}}

/* the shelf the jar sits on */
.stage{position:relative;min-height:380px;border-radius:14px;overflow:hidden;
background:radial-gradient(ellipse 60% 45% at 50% 30%,rgba(191,224,210,.12),transparent 70%),linear-gradient(#14211b,#0c1512 72%,#1c140e 72%,#140e0a);
box-shadow:inset 0 0 0 1px #2a4438}
.stage::after{content:"";position:absolute;left:0;right:0;top:72%;height:2px;background:#2e1e14}
#jar{position:absolute;z-index:1;left:50%;bottom:7%;transform:translateX(-50%);width:min(82%,290px);height:auto;overflow:visible}
#jar.shake .jarbody{animation:shake .7s ease-in-out}
#jar.shake .slips{animation:jostle .7s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg)}35%{transform:rotate(5deg)}55%{transform:rotate(-4deg)}75%{transform:rotate(2deg)}}
@keyframes jostle{0%,100%{transform:translateY(0)}25%{transform:translateY(-7px)}50%{transform:translateY(3px)}75%{transform:translateY(-4px)}}
.jarbody,.slips{transform-box:fill-box;transform-origin:50% 100%}
#flying{opacity:0}
#flying.go{animation:fly 1.1s cubic-bezier(.3,.7,.3,1) .55s forwards}
@keyframes fly{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.7)}15%{opacity:1}100%{opacity:0;transform:translate(70px,-150px) rotate(14deg) scale(1.5)}}

.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font:600 11px/1 var(--cinzel);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.slip{position:relative;flex:1;min-height:220px;border-radius:12px;padding:20px 20px 18px;color:#2a2117;
background:linear-gradient(170deg,#f5eedc,#e9dec3);box-shadow:0 10px 28px rgba(0,0,0,.45),inset 0 0 0 1px rgba(120,95,55,.25)}
.slip::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(120,95,55,.22),transparent)}
.slip.open{animation:unfold .6s ease-out}
@keyframes unfold{0%{transform:perspective(600px) rotateX(70deg);opacity:0}100%{transform:none;opacity:1}}
.slip h2{font:700 30px/1.05 var(--serif);margin:4px 0 2px;color:#14251c;text-wrap:balance}
.slip .by{font:italic 600 18px var(--serif);color:#1f6646}
.slip .empty{font:italic 500 21px/1.3 var(--serif);color:#5b4a33;margin-top:30px;text-align:center}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.facts span{font:600 11px/1 var(--font);letter-spacing:.04em;padding:5px 9px;border-radius:999px;background:rgba(31,102,70,.12);color:#1f5a40;border:1px solid rgba(31,102,70,.25)}
.facts span.star{background:#1f6646;color:#f1f5f2;border-color:#1f6646}
.tags{font:italic 500 16px/1.35 var(--serif);color:#4b3d2a}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:400 13px var(--font);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--emerald);border-color:var(--accent);color:#f1f5f2}
.sub{font:600 11px/1 var(--cinzel);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 13px var(--cinzel);letter-spacing:.08em;border:1px solid #4fbf8a;border-radius:999px;padding:11px 22px;cursor:pointer;background:linear-gradient(#22875b,#175e40);color:#f1f5f2;box-shadow:0 0 18px rgba(79,191,138,.18);text-decoration:none;display:inline-block}
.btn.alt{background:transparent;border-color:rgba(195,205,200,.5);color:var(--silver);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:12px;color:var(--muted);min-height:18px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tag{font:600 10px/1 var(--cinzel);letter-spacing:.12em;text-transform:uppercase;color:#7fdcae;background:#163327;border-radius:999px;padding:4px 8px}
/* "tonight I'm in the mood for" panel */
.moodbox{position:relative;margin-top:22px;border:2px solid #3b7f60;border-radius:20px;padding:20px 20px 10px;background:#0d1612}
.moodbox::before{content:"";position:absolute;inset:4px;border:1px solid rgba(195,205,200,.4);border-radius:15px;pointer-events:none}
.moodbox>.lbl{left:22px;font-size:12px;letter-spacing:.22em;color:#7fdcae}
.row{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px dashed rgba(79,191,138,.22)}
.row:last-child{border-bottom:0}
.row>span{font:600 11px/30px var(--cinzel);letter-spacing:.18em;text-transform:uppercase;color:#4fbf8a}
@media(max-width:520px){.row{grid-template-columns:minmax(0,1fr);gap:4px}.row>span{line-height:1.4}}
.empty-pool{font:italic 500 17px var(--serif);color:var(--muted)}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#jar.shake .jarbody,#jar.shake .slips,#flying.go,.slip.open{animation:none}}
</style>

<main>
<section class="card">
  <span class="lbl">Pick the jar</span>
  <h1>what to read <em>next</em></h1>
  <div class="meta" id="meta">Shake the jar for a fic from your to-read pile</div>
  <div class="moodbox">
    <span class="lbl">Tonight I'm in the mood for</span>
    <div id="rows"></div>
  </div>
  <div class="grid">
    <div class="stage">
      <svg id="jar" viewBox="0 0 300 360" role="img" aria-label="A glass apothecary jar with a silver lid and green ribbon, full of folded parchment slips">
        <defs>
          <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#bfe0d2" stop-opacity=".22"/><stop offset=".18" stop-color="#e8f5ef" stop-opacity=".1"/><stop offset=".5" stop-color="#bfe0d2" stop-opacity=".04"/><stop offset=".85" stop-color="#bfe0d2" stop-opacity=".12"/><stop offset="1" stop-color="#bfe0d2" stop-opacity=".26"/></linearGradient>
          <linearGradient id="silver" x1="0" x2="1"><stop offset="0" stop-color="#2f3634"/><stop offset=".2" stop-color="#7f8a86"/><stop offset=".42" stop-color="#e9eeec"/><stop offset=".58" stop-color="#b3bdb9"/><stop offset=".82" stop-color="#5f6965"/><stop offset="1" stop-color="#262c2a"/></linearGradient>
          <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a8a5e"/><stop offset="1" stop-color="#0f4a31"/></linearGradient>
          <clipPath id="inside"><path d="M86 92Q60 104 56 140V300Q56 330 86 332H214Q244 330 244 300V140Q240 104 214 92Z"/></clipPath>
          <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
        </defs>
        <ellipse cx="150" cy="340" rx="110" ry="10" fill="#000" opacity=".55" filter="url(#blur)"/>
        <g class="jarbody">
          <g class="slips" id="slips" clip-path="url(#inside)"></g>
          <path d="M86 92Q60 104 56 140V300Q56 330 86 332H214Q244 330 244 300V140Q240 104 214 92Z" fill="url(#glass)" stroke="#bfe0d2" stroke-opacity=".55" stroke-width="2"/>
          <path d="M70 140Q72 112 92 104" stroke="#fff" stroke-opacity=".45" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M68 160V290" stroke="#fff" stroke-opacity=".22" stroke-width="7" stroke-linecap="round"/>
          <path d="M230 150V286" stroke="#fff" stroke-opacity=".12" stroke-width="3" stroke-linecap="round"/>
          <!-- neck and silver lid -->
          <path d="M98 70H202V92H98Z" fill="url(#glass)" stroke="#bfe0d2" stroke-opacity=".5" stroke-width="1.5"/>
          <rect x="90" y="46" width="120" height="28" rx="6" fill="url(#silver)" stroke="#1e2422" stroke-width="1.5"/>
          <path d="M94 52H206M94 68H206" stroke="#1e2422" stroke-opacity=".35" stroke-width="1"/>
          <path d="M96 56H204" stroke="#fff" stroke-opacity=".5" stroke-width="1.4"/>
          <ellipse cx="150" cy="46" rx="58" ry="7" fill="url(#silver)" stroke="#1e2422" stroke-width="1.2"/>
          <circle cx="150" cy="36" r="9" fill="url(#silver)" stroke="#1e2422" stroke-width="1.2"/>
          <!-- green ribbon and bow round the neck -->
          <rect x="96" y="76" width="108" height="10" fill="url(#ribbon)"/>
          <path d="M150 81C136 70 118 70 120 82C122 94 140 88 150 81Z" fill="url(#ribbon)" stroke="#0a3022" stroke-width="1"/>
          <path d="M150 81C164 70 182 70 180 82C178 94 160 88 150 81Z" fill="url(#ribbon)" stroke="#0a3022" stroke-width="1"/>
          <path d="M148 84L138 112L146 108L150 116L152 86Z" fill="#14573a"/><path d="M152 84L164 110L156 107L151 115Z" fill="#0f4a31"/>
          <circle cx="150" cy="81" r="4.5" fill="#1d7a51" stroke="#0a3022"/>
          <!-- parchment label -->
          <path d="M100 178H200V232H100Z" fill="#efe6cf" stroke="#9c8a63" stroke-width="1.2" transform="rotate(-2 150 205)"/>
          <path d="M106 184H194V226H106Z" fill="none" stroke="#1f6646" stroke-width="1" stroke-dasharray="2 3" transform="rotate(-2 150 205)"/>
          <text x="150" y="203" text-anchor="middle" transform="rotate(-2 150 205)" font-family="Cinzel,Georgia,serif" font-size="11" letter-spacing="2.5" fill="#1f4a36">TO BE READ</text>
          <text x="150" y="222" text-anchor="middle" transform="rotate(-2 150 205)" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-size="15" fill="#3d2f1f" id="jarCount">fics</text>
        </g>
        <g id="flying" transform="translate(150 86)"><g transform="translate(-22 -9)">
          <rect width="44" height="18" rx="2" fill="#f5eedc" stroke="#9c8a63" stroke-width="1"/><path d="M22 0V18" stroke="#9c8a63" stroke-width=".8"/></g></g>
      </svg>
    </div>

    <div class="panel">
      <div class="slip" id="slip" aria-live="polite"><div class="empty">Shake the jar to draw your next fic.</div></div>
      <div class="acts">
        <button class="btn" id="shake">shake the jar</button>
        <button class="btn alt" id="start" hidden>start reading</button>
        <a class="btn alt" id="open" target="_blank" rel="noopener" hidden>open fic</a>
      </div>
      <div class="note" id="note"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const f=n=>(+n).toFixed(1);

/* Examples so the jar works outside your site; your real to-read fics replace them on your Notion page. */
const SAMPLE=[
 {t:'Example fic one',len:'Novel (50-200k)',pair:'HG x DM',mat:'Explicit',era:['Post War'],tags:['Slow burn','E2L','Angst','Smut'],ws:'Complete',kindle:true},
 {t:'Example fic two',len:'Novella (15-50k)',pair:'HG x DM',mat:'Teen +',era:['8th Year'],tags:['Fluff','Banter','Snowed In'],ws:'Complete',rec:'⭐',kindle:true},
 {t:'Example fic three',len:'Epic (200-450k)',pair:'HG x DM',mat:'Mature',era:['War'],tags:['Dark','War','Morally Grey','Slow burn'],ws:'WIP'},
 {t:'Example fic four',len:'One-Shot (>15k)',pair:'HG x DM',mat:'General',era:['Hogwarts'],tags:['Humour','Fake Relationship','Romance'],ws:'Complete'},
 {t:'Example fic five',len:'Novel (50-200k)',pair:'HG x DM',mat:'Explicit',era:['Ministry'],tags:['Marriage Law','Mystery','Sexual Tension'],ws:'Complete',rec:'⭐',kindle:true},
 {t:'Example fic six',len:'Novel (50-200k)',pair:'HG x DM',mat:'Mature',era:['AU'],tags:['Soulmates','Time Travel','Romance'],ws:'Complete'}];
let FICS=SAMPLE,live=false,pick=null;
const KEY=new URLSearchParams(location.search).get('key')||'';
const api=o=>fetch('/api/jar'+(KEY?'?key='+encodeURIComponent(KEY):''),o);

/* Mood rows. Each option matches words in a fic's tags, era and maturity in your Notion. */
const ROWS=[
 ['mood','mood',[['cozy',/fluff|humou?r|comedy|rom com|found family|snowed in|\bsoft\b|domestic|living together|roommates|chocolate/],
   ['dark',/\bdark|\bwar\b|morally grey|death eater|torture|horror|violence|voldemort wins|dead dove|toxic|blood magic/],
   ['angsty',/angst|hurt\/comfort|grief|ptsd|healing|mental health|recovery|coping|brooding|unrequited/],
   ['mysterious',/myster|whodunnit|thriller|\bspy\b|undercover|deception|secret|mistaken identity|courtroom/],
   ['adventurous',/action|adventure|horcrux|time travel|survival|indiana|apocalypse|battle|ancient magic/],
   ['funny',/humou?r|comedy|crack|parody|banter|snark|rom com|himbo/]]],
 ['heat','romance',[['sweet',null,x=>/general|teen|everyone/.test(x.matl)&&!/smut|explicit/.test(x.tagstr)],
   ['slow burn',/slow burn|mutual pining|pining|sexual tension|unresolved sexual|courtship|falling in love/],
   ['romantic',/romance|soulmate|wedding|marriage proposal|\bhea\b|fluff|falling in love|courtship/],
   ['spicy',null,x=>/explicit/.test(x.matl)||/smut|porn|lots of sex|dirty talk|praise kink|hate sex|eventual smut/.test(x.tagstr)]]],
 ['trope','trope',[['enemies to lovers',/e2l|enemies to|hate to love|love\/hate|rivalry/],
   ['forced proximity',/forced proximity|forced partnership|only one bed|snowed in|roommates|living together|co-workers|sharong a bed/],
   ['fake dating',/fake relationship|fake dating|marriage of conveniance/],
   ['soulmates',/soul ?mate|soul bond|soul bind|bonding magic|telepathic bond|mating|veela/],
   ['marriage law',/marriage law|marriage contract|forced marriage|arranged/]]],
 ['len','length',[['one-shot',null,x=>/one-shot/i.test(x.len||'')],['novella',null,x=>/novella/i.test(x.len||'')],
   ['novel',null,x=>/^novel/i.test(x.len||'')],['epic',null,x=>/epic|entire series/i.test(x.len||'')]]],
 ['mat','maturity',[['general',null,x=>/general|everyone/.test(x.matl)],['teen',null,x=>/teen/.test(x.matl)],
   ['mature',null,x=>/^mature/.test(x.matl)],['explicit',null,x=>/explicit/.test(x.matl)]]],
 ['kindle','kindle',[['on my kindle',null,x=>!!x.kindle],['not on kindle',null,x=>!x.kindle]]],
 ['era','era',[['hogwarts',/hogwarts|\d+th year|head girl|triwizard/],['post-war',/post war|post-war|adults|ministry|post grad|\bewe\b/],
   ['au',/\bau\b|canon divergent|muggle|no war|alternate/]]],
];
const EXTRAS=[['done','complete only',x=>/complete/i.test(x.ws||'')],['rec','⭐ recs only',x=>!!x.rec]];
let F=Object.assign({mood:'any',heat:'any',trope:'any',len:'any',mat:'any',kindle:'any',era:'any',done:false,rec:false},store.get('gd-jar-mood',{}));
const recent=store.get('gd-jar-recent',[]);
const prep=x=>{x.tagstr=(x.tags||[]).join(' | ').toLowerCase();x.erastr=((x.era||[]).join(' | ')+' | '+x.tagstr).toLowerCase();x.matl=(x.mat||'').toLowerCase();return x};
function matches(x,key,name){if(name==='any')return true;const row=ROWS.find(r=>r[0]===key),o=row[2].find(q=>q[0]===name);
  if(o[2])return o[2](x);return o[1].test(key==='era'?x.erastr:x.tagstr)}
function pool(){return FICS.map(prep).filter(x=>ROWS.every(([k])=>matches(x,k,F[k]))&&EXTRAS.every(([k,,fn])=>!F[k]||fn(x)))}
function chips(){
  const box=$('#rows');box.innerHTML='';
  ROWS.forEach(([k,label,opts])=>{const row=document.createElement('div');row.className='row';row.innerHTML='<span>'+label+'</span>';
    const c=document.createElement('div');c.className='chips';c.setAttribute('role','group');c.setAttribute('aria-label',label);
    [['any'],...opts].forEach(([n])=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.setAttribute('aria-pressed',F[k]===n);
      b.onclick=()=>{F[k]=n;store.set('gd-jar-mood',F);chips();refresh()};c.append(b)});
    row.append(c);box.append(row)});
  const row=document.createElement('div');row.className='row';row.innerHTML='<span>only</span>';
  const c=document.createElement('div');c.className='chips';
  EXTRAS.forEach(([k,l])=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.setAttribute('aria-pressed',!!F[k]);
    b.onclick=()=>{F[k]=!F[k];store.set('gd-jar-mood',F);chips();refresh()};c.append(b)});
  const clr=document.createElement('button');clr.className='chip';clr.textContent='clear all';
  clr.onclick=()=>{F={mood:'any',heat:'any',trope:'any',len:'any',mat:'any',kindle:'any',era:'any',done:false,rec:false};store.set('gd-jar-mood',F);chips();refresh()};c.append(clr);
  row.append(c);box.append(row);
}
function drawSlips(n){
  const r=rng(5),g=$('#slips'),k=Math.min(60,Math.max(4,n)),fill=Math.min(.78,.18+k/80);
  const COL=['#f5eedc','#efe5cc','#e8dcc0','#f2e9d3','#e2d5b6'];
  let o='',top=330-fill*220;
  for(let i=0;i<k;i++){const x=64+r()*172,y=top+r()*(330-top),a=(r()-.5)*70,w=30+r()*16,h=12+r()*7,c=COL[(r()*COL.length)|0];
    o+=`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(a)})"><rect x="${f(-w/2)}" y="${f(-h/2)}" width="${f(w)}" height="${f(h)}" rx="1.5" fill="${c}" stroke="#9c8a63" stroke-width=".7"/><path d="M0 ${f(-h/2)}V${f(h/2)}" stroke="#9c8a63" stroke-width=".6" opacity=".7"/></g>`}
  g.innerHTML=o;
  $('#jarCount').textContent=n+' fic'+(n===1?'':'s');
}
function refresh(){const n=pool().length;drawSlips(n);
  $('#meta').innerHTML='<b>'+FICS.length+'</b> fics on your to-read pile · <b>'+n+'</b> match your filters';
  $('#shake').disabled=!n;
  if(!n&&!pick)$('#slip').innerHTML='<div class="empty">No fics in the jar match that mood. Loosen a filter or two.</div>';
  $('#foot').innerHTML=live?'<span>Drawn from your Notion fic list.</span>':'<span class="tag">example slips</span><span>Your real fics appear on your Notion page.</span>';
}
function show(x){
  const facts=[x.len,x.ch?x.ch+' chapters':null,x.pair,x.mat,x.ws,x.status,x.kindle?'on kindle':null].filter(Boolean).map(v=>'<span>'+esc(v)+'</span>').join('')+(x.rec?'<span class="star">'+esc(x.rec==='⭐'?'⭐ rec':x.rec+' rec')+'</span>':'');
  const tags=(x.tags||[]).slice(0,7);
  const s=$('#slip');s.classList.remove('open');void s.offsetWidth;s.classList.add('open');
  s.innerHTML='<div class="eyebrow">drawn from the jar</div><h2>'+esc(x.t)+'</h2>'+(x.a?'<div class="by">by '+esc(x.a)+'</div>':'')+
    '<div class="facts">'+facts+'</div>'+(tags.length?'<div class="tags">'+tags.map(esc).join(' · ')+'</div>':'');
  $('#start').hidden=!(live&&x.id);$('#start').disabled=false;$('#start').textContent='start reading';
  const o=$('#open');if(x.url){o.href=x.url;o.hidden=false}else o.hidden=true;
  $('#note').textContent='';
}
$('#shake').onclick=()=>{
  const p=pool();if(!p.length)return;
  let choices=p.filter(x=>!recent.includes(x.t));if(!choices.length)choices=p;
  pick=choices[(Math.random()*choices.length)|0];
  recent.push(pick.t);while(recent.length>Math.min(6,Math.max(0,p.length-1)))recent.shift();store.set('gd-jar-recent',recent);
  const jar=$('#jar'),fl=$('#flying');jar.classList.remove('shake');fl.classList.remove('go');void jar.getBBox();jar.classList.add('shake');fl.classList.add('go');
  $('#shake').disabled=true;
  const wait=matchMedia('(prefers-reduced-motion: reduce)').matches?0:1300;
  setTimeout(()=>{show(pick);$('#shake').disabled=false;$('#shake').textContent='shake again'},wait);
};
$('#start').onclick=async()=>{if(!pick||!pick.id)return;$('#start').disabled=true;$('#start').textContent='saving…';
  const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  try{const r=await api({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:pick.id,date:day})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('error '+r.status));
    $('#start').textContent='reading ✓';$('#note').textContent='Marked "'+pick.t+'" as currently reading in Notion. It will show up in your candle widget too.';
    FICS=FICS.filter(x=>x.id!==pick.id);refresh()}
  catch(e){$('#start').disabled=false;$('#start').textContent='start reading';$('#note').textContent="Couldn't update Notion: "+e.message}};

chips();refresh();
(async()=>{try{const r=await api({cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(!Array.isArray(j.fics))throw 0;
  FICS=j.fics;live=true;refresh()}catch(e){}})();
</script>
